name: Seam
options:
  bundleIdPrefix: dev.mwlr
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "1"

# Genau EINE Abhängigkeit: Sparkle für Updates (docs/SECURE-DESIGN.md E9, gleiche
# Vorlage wie Kalli). `exactVersion` statt `from:` und `Package.resolved` im Repo:
# Bei einem Updater darf nicht der Auflösungszeitpunkt entscheiden, welche Fassung
# ausgeliefert wird. Tastenkürzel ohne Fremdbibliothek: weniger Fremdcode in einer
# App mit Bedienungshilfen-Freigabe.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0

targets:
  Seam:
    type: application
    platform: macOS
    sources:
      - path: Seam
    resources:
      - path: Seam/Resources/HILFE.md
      - path: Seam/Resources/CHANGELOG.md
      - path: Seam/Resources/AppIcon.icns
      - path: Seam/Resources/THIRD-PARTY-LICENSES.md
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        INFOPLIST_FILE: Seam/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.seam
        CODE_SIGN_ENTITLEMENTS: Seam/Resources/Seam.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  # Prüft ausschließlich reine Rechenlogik (Raster, Andockzonen, Mitziehen).
  # Keine Bedienungshilfen, keine Fenster. Die App erkennt den Testlauf und
  # startet dann weder Tastenkürzel noch Maus-Beobachter (SeamApp).
  SeamTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SeamTests
    dependencies:
      - target: Seam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.seam.tests
