name: Seam
options:
  bundleIdPrefix: dev.mwlr
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

# Bewusst noch ohne Abhängigkeiten. Sparkle kommt mit dem ersten Release dazu
# (gleiche Vorlage wie Kalli, docs/SECURE-DESIGN.md E9). Tastenkürzel ohne
# Fremdbibliothek (E-Abhängigkeiten): weniger Fremdcode in einer App mit
# Bedienungshilfen-Freigabe.

targets:
  Seam:
    type: application
    platform: macOS
    sources:
      - path: Seam
    resources:
      - path: Seam/Resources/HILFE.md
      - path: Seam/Resources/CHANGELOG.md
    settings:
      base:
        INFOPLIST_FILE: Seam/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.seam
        CODE_SIGN_ENTITLEMENTS: Seam/Resources/Seam.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES

  # Prüft ausschließlich reine Rechenlogik (Raster, Andockzonen, Mitziehen).
  # Keine Bedienungshilfen, keine Fenster. Die App erkennt den Testlauf und
  # startet dann weder Tastenkürzel noch Maus-Beobachter (SeamApp).
  SeamTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SeamTests
    dependencies:
      - target: Seam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.seam.tests
