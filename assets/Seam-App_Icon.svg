<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Seam App-Symbol, 2026-10-08. Apples Raster: 824 px Symbol mit 100 px Rand im 1024er-Feld.
       Farben: App-Familie „Schiefer“ (Vault: 04 Ressourcen/App-Design-System), Akzent Iris
       #3E5398 / hell #98A9E1. Zwei Fenster, dazwischen die leuchtende Naht. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3350"/>
      <stop offset="1" stop-color="#151A27"/>
    </linearGradient>
    <linearGradient id="paneL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ECEFF6"/>
      <stop offset="1" stop-color="#D9DDE8"/>
    </linearGradient>
    <linearGradient id="paneR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D1E8"/>
      <stop offset="1" stop-color="#AEB8D6"/>
    </linearGradient>
    <filter id="glow" x="-200%" y="-20%" width="500%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Grundfläche (abgerundetes Quadrat, Radius ~22,5 % wie macOS) -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- linkes Fenster -->
  <g filter="url(#shadow)">
    <rect x="196" y="250" width="290" height="524" rx="42" fill="url(#paneL)"/>
    <rect x="196" y="250" width="290" height="70" rx="42" fill="#FFFFFF"/>
    <rect x="196" y="290" width="290" height="30" fill="#FFFFFF"/>
    <circle cx="240" cy="286" r="11" fill="#98A9E1"/>
    <circle cx="274" cy="286" r="11" fill="#C9D1E8"/>
    <rect x="232" y="356" width="200" height="22" rx="11" fill="#C3C9DA"/>
    <rect x="232" y="398" width="160" height="22" rx="11" fill="#C3C9DA"/>
    <rect x="232" y="440" width="186" height="22" rx="11" fill="#C3C9DA"/>
  </g>
  <!-- rechtes Fenster -->
  <g filter="url(#shadow)">
    <rect x="538" y="250" width="290" height="524" rx="42" fill="url(#paneR)"/>
    <rect x="538" y="250" width="290" height="70" rx="42" fill="#DCE2F2"/>
    <rect x="538" y="290" width="290" height="30" fill="#DCE2F2"/>
    <rect x="574" y="356" width="200" height="22" rx="11" fill="#97A2C2"/>
    <rect x="574" y="398" width="150" height="22" rx="11" fill="#97A2C2"/>
  </g>
  <!-- die Naht: Leuchten + feste Linie -->
  <rect x="501" y="220" width="22" height="584" rx="11" fill="#98A9E1" filter="url(#glow)" opacity="0.9"/>
  <rect x="505" y="232" width="14" height="560" rx="7" fill="#C9D4FF"/>
  <!-- Griffe auf der Naht: man kann sie verschieben -->
  <circle cx="512" cy="512" r="30" fill="#98A9E1"/>
  <path d="M487 512 l14 -11 v22 z M537 512 l-14 -11 v22 z" fill="#151A27"/>
</svg>
