# SwiftLint — Seam (übernommen von Kalli, 2026-10-08)
# Eingeführt 2026-09-24. Jede Abweichung vom Default ist bewusst entschieden,
# Begründung steht dabei. Lauf: `make lint` (oder `swiftlint lint`).

included:
  - Seam
  - SeamTests

excluded:
  - build
  - dist
  - .build

disabled_rules:
  # Komma nach dem letzten Element macht Diffs sauberer (eine Zeile statt zwei).
  - trailing_comma
  # `var x: T? = nil` ist explizit und schadet nicht — reine Stilfrage.
  - implicit_optional_initialization

identifier_name:
  # r/g/b bei Farben, v/c in Closures, `.on` als Enum-Fall: kurz ist hier lesbarer.
  min_length:
    warning: 1
    error: 1

line_length:
  warning: 150
  error: 250
  ignores_comments: true
  ignores_urls: true
  # Die langen Zeilen sind os_log-Meldungen mit Interpolation — umbrechen macht sie
  # schlechter lesbar, nicht besser.
  ignores_interpolated_strings: true

# Sperrklinke statt Refactoring: knapp über dem Stand vom 2026-09-24
# (CalendarStore 621 Zeilen / 328 Typ-Zeilen). Wächst eine Datei darüber hinaus,
# ist das der Moment zum Aufteilen — nicht vorher.
file_length:
  warning: 650
  error: 800
type_body_length:
  warning: 350
  error: 450

custom_rules:
# Seam, docs/SECURE-DESIGN.md E3: Attribute fremder Fenster nur über die
# Positivliste in AXAccess.swift lesen. Wer hier einen Treffer bekommt, liest
# an der Positivliste vorbei — z. B. einen Fenstertitel.
  ax_nur_ueber_allowlist:
    name: "AX-Lesen nur über die Positivliste"
    # Code-Audit 09.10. (S4): auch die Mehrfach-, Parameter- und Namens-Varianten und Beobachter
    # mit Info-Dictionary — sonst ließe sich die Positivliste umgehen.
    regex: 'AXUIElementCopy(Multiple|Parameterized)?Attribute(Value|Values|Names)|AXObserverCreateWithInfoCallback'
    excluded: 'Seam/Core/AXAccess\.swift'
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Fremde Fensterattribute nur über AXAccess.*  lesen (SECURE-DESIGN E3)."
    severity: error

  # Seam, docs/SECURE-DESIGN.md E12: Aktionen auslösen und Attribute schreiben nur in
  # AXAccess.swift, dort über die Positivlisten (AXActionName, setFrame, setMinimized).
  ax_schreiben_nur_ueber_axaccess:
    name: "AX-Aktionen/Schreiben nur in AXAccess"
    regex: 'AXUIElementPerformAction|AXUIElementSetAttributeValue'
    excluded: 'Seam/Core/AXAccess\.swift'
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Aktionen und Schreibzugriffe auf fremde Fenster nur über AXAccess (SECURE-DESIGN E12)."
    severity: error

  # Seam, docs/SECURE-DESIGN.md E13: aus der Fensterliste nie Titel oder App-Namen lesen.
  keine_fenstertitel:
    name: "Keine Fenstertitel aus der Fensterliste"
    regex: 'kCGWindowName|kCGWindowOwnerName'
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Fensterliste nur Nummer/Prozess/Ebene/Lage lesen (SECURE-DESIGN E13)."
    severity: error

  # Seam, docs/SECURE-DESIGN.md E14: nicht dokumentierte Systemfunktionen nur in SpaceReader.swift.
  private_schnittstelle_nur_spacereader:
    name: "Private Schnittstelle nur in SpaceReader"
    regex: '@_silgen_name'
    excluded: 'Seam/Core/SpaceReader\.swift'
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Nicht dokumentierte Funktionen nur in SpaceReader.swift deklarieren (SECURE-DESIGN E14)."
    severity: error

  # Seam, docs/SECURE-DESIGN.md E1/E2 maschinell (Code-Audit 09.10., S4): keine künstlichen
  # Eingaben, keine Event-Taps, keine Tastatur-Beobachtung. Der passive Maus-Beobachter
  # (addGlobalMonitorForEvents mit leftMouse…) ist erlaubt und wird nicht erfasst.
  keine_synthetischen_ereignisse:
    name: "Keine künstlichen Eingaben / Tastatur-Beobachtung"
    regex: 'AXUIElementPostKeyboardEvent|CGEventPost|CGEventTapCreate|CGEvent\.tapCreate|\.post\(tap:|\.keyDown|\.keyUp|\.flagsChanged'
    excluded_match_kinds:
      - comment
      - doccomment
    message: "Seam erzeugt keine Eingaben und liest keine Tastatur mit (SECURE-DESIGN E1/E2)."
    severity: error

  # Tippi, 2026-09-14: `NSApp.delegate as? AppDelegate` an 21 Stellen. In einer
  # SwiftUI-App mit @NSApplicationDelegateAdaptor ist NSApp.delegate NICHT die
  # eigene AppDelegate-Instanz — der Cast liefert immer nil, `?.` verschluckt es,
  # nichts passiert, kein Fehler. Vier Stunden Fehlersuche.
  # Stattdessen: AppDelegate-Instanz explizit durchreichen oder ein eigenes
  # statisches `AppDelegate.shared` setzen.
  dead_app_delegate_cast:
    name: "Toter AppDelegate-Cast"
    regex: 'NSApp(lication\.shared)?\.delegate\s+as[?!]\s*AppDelegate'
    # Nur Code, keine Kommentare: Die Warnkommentare, die genau vor diesem Cast
    # warnen, zitieren ihn — ohne Ausschluss meldete die Regel beim Tippi-Rollout
    # (2026-09-25) 3 Treffer, alle in solchen Kommentaren.
    excluded_match_kinds:
      - comment
      - doccomment
    message: "NSApp.delegate ist unter SwiftUI nicht die eigene AppDelegate — Cast liefert still nil. AppDelegate explizit durchreichen."
    severity: error

cyclomatic_complexity:
  # Reine Zuordnungstabellen (`switch` über Textstile in FamilyTheme.font(_:weight:),
  # gespiegelt aus der Vault-Vorlage 04 Ressourcen/App-Design-System) zählen sonst
  # jeden `case` als Verzweigung — Komplexität 20 bei null echter Logik. Gleiche
  # Einstellung wie Tippi. Eingeführt 2026-10-07: der Sync-Commit beb4dd9 hatte
  # `make lint` und damit `make release` still blockiert.
  ignores_case_statements: true

