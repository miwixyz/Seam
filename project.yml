name: Seam
options:
  bundleIdPrefix: dev.mwlr
  deploymentTarget:
    macOS: "27.0"
  developmentLanguage: de
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.5.2"
    CURRENT_PROJECT_VERSION: "1"

# Genau EINE Abhängigkeit: Sparkle für Updates (docs/SECURE-DESIGN.md E9, gleiche
# Vorlage wie Kalli). `exactVersion` statt `from:` und `Package.resolved` im Repo:
# Bei einem Updater darf nicht der Auflösungszeitpunkt entscheiden, welche Fassung
# ausgeliefert wird. Tastenkürzel ohne Fremdbibliothek: weniger Fremdcode in einer
# App mit Bedienungshilfen-Freigabe.
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1

targets:
  Seam:
    type: application
    platform: macOS
    sources:
      - path: Seam
      # E23: Schnittstelle zum Root-Helfer SeamWake, in beiden Zielen.
      - path: Shared
      # E20: Nachrichtenformat des Stream-Deck-Plugins, in Seam und im Plugin dieselbe Datei.
      - path: SharedDeck
      # E20: Stream-Deck-Plugin (Manifest, Einstellungsseite, Symbole) als Ordner nach Contents/Resources.
      # Das Programm `seamdeck` kommt über die Abhängigkeit unten in denselben Ordner.
      - path: SeamDeck/dev.mwlr.seam.deck.sdPlugin
        type: folder
        buildPhase: resources
      # E23: launchd-Eintrag für SMAppService.daemon, an der Stelle, an der macOS ihn sucht.
      - path: LaunchDaemons/dev.mwlr.seam.wake.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
    resources:
      - path: Seam/Resources/HILFE.md
      - path: Seam/Resources/CHANGELOG.md
      - path: Seam/Resources/Assets.xcassets
      - path: Seam/Resources/seam.caf
      - path: Seam/Resources/THIRD-PARTY-LICENSES.md
      - path: Seam/Resources/PlusJakartaSans-Variable.ttf
    dependencies:
      - package: Sparkle
        product: Sparkle
      # E22: Supertaste als eigener Prozess, eingebettet unter Contents/Helpers.
      - target: SeamKeys
        embed: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      # E23: Root-Helfer, liegt neben Seam in Contents/MacOS (BundleProgram im launchd-Eintrag).
      - target: SeamWake
        embed: true
        copy:
          destination: executables
      # E20: Stream-Deck-Plugin, eigenes Programm mit eigener Kennung, damit Seam den Absender prüfen kann.
      - target: SeamDeck
        embed: true
        link: false
        codeSign: true
        copy:
          destination: resources
          subpath: dev.mwlr.seam.deck.sdPlugin
    settings:
      base:
        INFOPLIST_FILE: Seam/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.seam
        CODE_SIGN_ENTITLEMENTS: Seam/Resources/Seam.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Maskottchen der App-Familie als klassisches AppIcon.appiconset (wie Tippi): kein
        # Glas, eigenes Squircle im Bild. Das alte Icon-Composer-Symbol liegt unter design/.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"

  # E22: Supertaste. Nur Tastatur-Code, eigene Kennung und eigene Freigabe (docs/SECURE-DESIGN.md).
  SeamKeys:
    type: application
    platform: macOS
    sources:
      - path: SeamKeys
    info:
      path: SeamKeys/Info.plist
      properties:
        CFBundleName: SeamKeys
        CFBundleDisplayName: SeamKeys
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: "27.0"
        NSHumanReadableCopyright: "© 2026 Michael Wildenauer"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.seam.keys
        CODE_SIGN_ENTITLEMENTS: Seam/Resources/Seam.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  # E23: Wach bei zugeklapptem Deckel. Läuft als root (launchd), kann nur pmset disablesleep.
  SeamWake:
    type: tool
    platform: macOS
    sources:
      - path: SeamWake
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SeamWake
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.seam.wake
        # Kennung im Programm selbst, damit sie auch ein erneutes Signieren übersteht
        # (Seam prüft sie in WakeXPC.helperRequirement).
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        # Leere Berechtigungsdatei wie SeamKeys: ohne sie setzt Xcode beim Archivieren
        # com.apple.application-identifier ein (Release-Gate E23 fing das am 20.11.).
        CODE_SIGN_ENTITLEMENTS: Seam/Resources/Seam.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  # E20: Stream-Deck-Plugin „SeamDeck“. Wird von Elgatos Stream Deck gestartet, spricht dessen WebSocket und Seams geprüften
  # Socket `deck.sock`. Keine Berechtigungen. Nachrichtenformat = dieselbe Datei wie in Seam (SharedDeck/DeckWire).
  # Kennung im Programm (eingebettete Info.plist), weil Seam den Peer an `dev.mwlr.seam.deck` erkennt.
  SeamDeck:
    type: tool
    platform: macOS
    sources:
      - path: SeamDeck
        excludes:
          - dev.mwlr.seam.deck.sdPlugin/**
      - path: SharedDeck
    settings:
      base:
        PRODUCT_NAME: seamdeck
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.seam.deck
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: Seam/Resources/Seam.entitlements
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES


  # Prüft ausschließlich reine Rechenlogik (Raster, Andockzonen, Mitziehen).
  # Keine Bedienungshilfen, keine Fenster. Die App erkennt den Testlauf und
  # startet dann weder Tastenkürzel noch Maus-Beobachter (SeamApp).
  SeamTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SeamTests
      # E22: reine Logik der Supertaste mitprüfen (der Helfer selbst ist kein Test-Host).
      - path: SeamKeys/HyperLogic.swift
    dependencies:
      - target: Seam
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_TESTABILITY: YES
        PRODUCT_BUNDLE_IDENTIFIER: dev.mwlr.seam.tests
